# A workflow to do PR test runs
#
# Reference:
#   - https://github.com/actions/checkout
#   - https://github.com/conda-incubator/setup-miniconda

name: ci-tests

# Triggers the workflow on pull-request or push events
on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  tests:
    name: "Test session=${{ matrix.session }}  Python=${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        session: ["tests"]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    defaults:
      run:
        shell: bash -l {0}

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

      - name: "Set up conda"
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: testenv
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          show-channel-urls: true

      - name: "Create a conda environment"
        run: |
          conda create --yes  --name testenv python=${{ matrix.python-version }}

      - name: "Conda info"
        run: |
          conda info
          conda list --explicit

      - name: "Run tests"
        run: |
          pytest -v ./tests
